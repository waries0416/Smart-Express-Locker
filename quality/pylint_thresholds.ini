# pylint 分数门槛与基线策略 · 智能快递柜管理系统
# ----------------------------------------------------------------------------
# 为什么要有这份文件：
#   pylint 满分 10.0 是"代码风格分"，不等于质量。为了让门槛可复核、可比较，
#   这里把「旧代码基线」与「新模块门槛」分开，由 quality/run_all.ps1 自动判定。
#
# 判定规则（run_all.ps1 实际执行的就是这张表）：
#   1. 旧代码（baseline 清单内的模块）：分数 **不得低于** 首次采集的基线分
#      （允许 +0.0，即"不许越改越低"），基线值在 quality/reports/pylint_baseline.md 中固化。
#   2. 新模块（AI 推荐 / 地图找柜 / 支付）：分数 **必须 >= 9.0**，
#      且 error(E) 计数必须为 0。
#   3. 任何模块出现 E 类（真实缺陷）一律视为不达标，与分数无关。
#
# 状态：基线分在首次全量运行后回填（见 quality/reports/pylint_baseline.md）。

[thresholds]
new_module_min_score = 9.0
new_module_max_errors = 0
legacy_regression_tolerance = 0.0     # 旧代码允许的分数下降幅度
legacy_max_errors = 0                 # 旧代码同样不允许有 E 类错误

[baseline]
# 旧模块基线分（首次采集后回填，run_all.ps1 从 pylint_baseline.md 读取实测值）
# 格式：模块名 = 基线分
backend/app.py        = TBD
backend/auth.py       = TBD
backend/business.py   = TBD
backend/db.py         = TBD
backend/entities.py   = TBD
backend/mobile_api.py = TBD
backend/notify.py     = TBD
backend/qr_login.py   = TBD
backend/stats.py      = TBD

[new_modules]
# 创新能力相关新模块：文件名匹配下列模式即按新模块门槛判定
patterns =
    backend/ai_*.py
    backend/*recommend*.py
    backend/*map*.py
    backend/*nearby*.py
    backend/*pay*.py
    backend/*payment*.py
